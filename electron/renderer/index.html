<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- CSP: no inline scripts, no remote resources -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>Chrome Isolation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Custom frameless titlebar -->
  <div id="titlebar">
    <div class="titlebar-drag">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" class="titlebar-icon">
        <rect x="3" y="3" width="18" height="18" rx="3"/>
        <line x1="9" y1="3" x2="9" y2="21"/>
      </svg>
      <span class="titlebar-title">Chrome Isolation</span>
    </div>
    <div class="titlebar-controls">
      <button class="wc-btn wc-theme" id="btnTheme" title="Toggle light/dark">
        <!-- moon icon (dark mode indicator) -->
        <svg id="iconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <!-- sun icon (light mode indicator) -->
        <svg id="iconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </button>
      <button class="wc-btn wc-min"   id="btnWinMin"   title="Minimize">
        <svg viewBox="0 0 12 12" fill="currentColor"><rect x="0" y="5.5" width="12" height="1"/></svg>
      </button>
      <button class="wc-btn wc-max"   id="btnWinMax"   title="Maximize">
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2">
          <rect x="1.5" y="1.5" width="9" height="9" rx="1"/>
        </svg>
      </button>
      <button class="wc-btn wc-close" id="btnWinClose" title="Close">
        <svg viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <line x1="1.5" y1="1.5" x2="10.5" y2="10.5"/>
          <line x1="10.5" y1="1.5" x2="1.5" y2="10.5"/>
        </svg>
      </button>
    </div>
  </div>

  <div id="app">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <line x1="9" y1="3" x2="9" y2="21"/>
        </svg>
        <span>Chrome Isolation</span>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-item active" data-view="profiles">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="8" r="4"/>
            <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
          </svg>
          Profiles
        </button>
      </nav>

      <div class="sidebar-footer">
        <button class="btn btn-primary" id="btnCreate">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          New Profile
        </button>
        <button class="btn btn-secondary" id="btnImport">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Import
        </button>
      </div>
    </aside>

    <!-- Main content -->
    <main class="content">
      <header class="content-header">
        <h1>Profiles</h1>
        <button class="icon-btn" id="btnRefresh" title="Refresh">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
            <path d="M21 3v5h-5"/>
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
            <path d="M3 21v-5h5"/>
          </svg>
        </button>
      </header>

      <div id="profilesGrid" class="profiles-grid">
        <div class="empty-state" id="emptyState" style="display:none;">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.5">
            <circle cx="12" cy="8" r="4"/>
            <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
          </svg>
          <p>No profiles yet. Create one to get started.</p>
        </div>
        <div class="loading-state" id="loadingState">
          <div class="spinner"></div>
          <p>Loading…</p>
        </div>
      </div>
    </main>
  </div>

  <!-- Create modal -->
  <div class="modal-overlay" id="modalCreate" style="display:none;">
    <div class="modal">
      <h2>New Profile</h2>
      <p class="modal-sub">Set up a new isolated browser profile</p>
      <form id="createForm">
        <label>Profile Name
          <input type="text" id="inputName" placeholder="e.g. Work, Fiverr, Personal"
                 pattern="[a-zA-Z0-9_-]+" maxlength="64" required autocomplete="off">
          <small>Letters, numbers, dash and underscore only.</small>
        </label>
        <label>Custom Location <span class="opt">(optional)</span>
          <input type="text" id="inputPath" placeholder="Leave empty for default ~/Chrome/…"
                 autocomplete="off">
        </label>
        <label>Host Folder <span class="opt">(read-only, optional)</span>
          <input type="text" id="inputHostMount" placeholder="Leave empty to mount your home directory"
                 autocomplete="off">
          <small>Mounted read-only at /home/chrome/host inside the container.</small>
        </label>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="btnCreateCancel">Cancel</button>
          <button type="submit" class="btn btn-primary">Create</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Confirm modal -->
  <div class="modal-overlay" id="modalConfirm" style="display:none;">
    <div class="modal">
      <h2 id="confirmTitle">Confirm</h2>
      <p id="confirmMsg"></p>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="btnConfirmNo">Cancel</button>
        <button class="btn btn-danger"    id="btnConfirmYes">Confirm</button>
      </div>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toasts"></div>

  <script src="app.js"></script>
</body>
</html>
